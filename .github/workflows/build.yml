name: Build and Deploy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  # Fired by inosaint/ai when its project list changes. The homepage's Projects
  # letter is scraped from that site at BUILD time (see astro-site/src/pages/index.astro),
  # so a new project only reaches the homepage once this repo rebuilds.
  repository_dispatch:
    types: [projects-updated]
  # Manual button in the Actions tab, for refreshing without a commit.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'astro-site/package-lock.json'

      - name: Install dependencies
        working-directory: ./astro-site
        run: npm ci

      - name: Build Astro site
        working-directory: ./astro-site
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: astro-site/dist/

  deploy:
    # Deploy on master pushes, on a manual run, and when the AI projects repo
    # says its list changed. Never on pull_request — that builds only.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
